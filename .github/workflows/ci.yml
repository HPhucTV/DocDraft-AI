name: CI/CD Quality Gate

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  nextjs-quality-gate:
    name: Next.js & Frontend Quality Gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/docdraft_ci?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/docdraft_ci?schema=public"
      NEXTAUTH_SECRET: "ci-secret-for-testing-only-docdraft-ai-2026"
      UPSTASH_REDIS_REST_URL: "https://example.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "example_token"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Prisma Schema Syntax
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint Check (ESLint)
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: |
          npx tsx tests/unit/test-seed-templates.ts
          npx tsx tests/unit/test-compliance-engine.ts
          npx tsx tests/unit/test-suggestion-mode.ts
          npx tsx tests/unit/test-ai-feedback.ts
          npx tsx tests/unit/test-pdf-page-break.ts

  document-service-gate:
    name: Python Document Service Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/document-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/document-service/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests
